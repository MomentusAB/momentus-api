<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Momentus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#16202A">
  <meta name="color-scheme" content="light">

  <!-- iOS: full-screen when added to the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Momentus">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" class="toast" hidden></div>

  <!-- Barcode fallback for browsers without BarcodeDetector (Safari). -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" defer></script>
  <script src="i18n.js"></script>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
